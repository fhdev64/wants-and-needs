<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>хотелкино ✦︎</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- per-element lens filters are injected here by glass.js -->
<svg id="lensDefs" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>

<div class="wallpaper" aria-hidden="true"></div>

<!-- top bar: brand · tabs · window controls (the whole bar drags the window) -->
<header class="topnav drag">
  <div class="brand"><span class="brand-mark">✦</span>хотелкино</div>

  <nav class="nav no-drag" aria-label="Разделы">
    <div class="nav-pill"></div>
    <button class="nav-btn" data-view="list">
      <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.5-9.3C1.1 7.8 3.3 4 7 4c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.7 0 5.9 3.8 4.5 7.2-2 4.7-9.5 9.3-9.5 9.3z"/></svg>
      <span>Хотелки</span><em id="count"></em>
    </button>
    <button class="nav-btn" data-view="add">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>Добавить</span>
    </button>
    <button class="nav-btn" data-view="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <span>Профиль</span>
    </button>
  </nav>

  <div class="winctl no-drag">
    <button data-w="min" aria-label="Свернуть"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    <button data-w="max" aria-label="Развернуть"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
    <button data-w="close" class="close" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
  </div>
</header>

<main class="content" id="content">
  <div class="page">
    <header class="toolbar">
      <h1 id="title"></h1>
      <div class="tools" id="tools"></div>
    </header>
    <section class="view" id="view"></section>
  </div>
</main>

<div class="login drag" id="login"></div>
<div class="sheet-wrap" id="sheet"><div class="sheet lg lg-regular" data-lens="28" id="sheetBody" role="dialog" aria-modal="true"></div></div>
<div class="menu lg lg-regular" data-lens="20" id="menu" role="menu"></div>
<div class="toast lg lg-regular" data-lens="999" id="toast" role="status"></div>

<script src="glass.js"></script>
<script src="app.js"></script>
</body>
</html>
