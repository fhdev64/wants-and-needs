<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>хотелкино ✦︎</title>
<style>
@font-face{font-family:"Manrope";src:url("fonts/Manrope.ttf") format("truetype");font-weight:200 800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;overflow:hidden;font-family:"Manrope","Segoe UI",sans-serif;color:#f4f6fb;user-select:none;cursor:default}
.card{position:absolute;inset:10px;border-radius:24px;padding:14px;display:flex;gap:14px;align-items:center;
  background:radial-gradient(120% 140% at 0% 0%,rgba(47,91,255,.55),rgba(20,36,110,.35) 45%,rgba(11,13,20,.96) 75%),#0b0d14;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.25),0 18px 40px -12px rgba(0,0,0,.7);
  transform:translateX(120%) scale(.96);opacity:0;transition:transform .7s cubic-bezier(.2,1.25,.3,1),opacity .3s}
.card.in{transform:none;opacity:1}
.card.out{transform:translateX(120%);opacity:0;transition:transform .4s ease-in,opacity .3s}
.img{width:86px;height:86px;border-radius:16px;flex:none;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(180deg,#f4f6fa,#dde3ee);box-shadow:0 10px 24px -10px rgba(47,91,255,.9)}
.img img{max-width:84%;max-height:84%;object-fit:contain}
.img.none{background:linear-gradient(135deg,#3b66ff,#1a2fb8 60%,#0e1440);font-size:38px;color:#fff}
.body{flex:1;min-width:0}
.eyebrow{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#e9c46a}
.eyebrow .brand{margin-left:auto;color:rgba(235,240,255,.45);letter-spacing:.04em;text-transform:none;font-weight:700}
.name{margin-top:4px;font-size:15px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prices{margin-top:6px;display:flex;align-items:baseline;gap:10px}
.old{font-size:13px;color:#9ba1b3;text-decoration:line-through}
.new{font-size:24px;font-weight:800;letter-spacing:-.01em;color:#a9cbff}
.badge{font-size:12px;font-weight:800;padding:3px 8px;border-radius:10px;background:rgba(74,222,128,.16);color:#4ade80}
.store{margin-top:2px;font-size:12px;color:#9ba1b3}
.x{position:absolute;top:10px;right:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#9ba1b3;font-size:14px;opacity:0;transition:opacity .2s}
.card:hover .x{opacity:1}
.x:hover{background:rgba(255,255,255,.1);color:#fff}
.bar{position:absolute;left:24px;right:24px;bottom:8px;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3b66ff,#a9cbff);transform-origin:left;animation:t 9s linear forwards}
.card:hover .bar i{animation-play-state:paused}
@keyframes t{from{transform:scaleX(1)}to{transform:scaleX(0)}}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="img" id="img"></div>
  <div class="body">
    <div class="eyebrow"><span id="kind"></span><span class="brand">✦ хотелкино</span></div>
    <div class="name" id="name"></div>
    <div class="prices"><span class="new" id="new"></span><span class="old" id="old"></span><span class="badge" id="badge"></span></div>
    <div class="store" id="store"></div>
  </div>
  <div class="x" id="x">✕</div>
  <div class="bar"><i id="bar"></i></div>
</div>
<script src="notify.js"></script>
</body>
</html>
